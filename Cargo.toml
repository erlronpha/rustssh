[package]
name = "rustssh"
version = "0.1.0"
edition = "2021"
description = "A desktop SSH session manager with a terminal and SFTP browser"
license = "MIT"
publish = false

[dependencies]
dirs = "6"
iced = { version = "0.14", features = ["advanced", "canvas", "svg", "tokio"] }
iced_graphics = "0.14"
rfd = "0.15"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "time"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
vte = "0.15"

[profile.dev.package."*"]
opt-level = 1
